<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skygotchimon</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white font-inter">

    <!-- Tela 0: Menu Principal -->
    <section id="tela-menu" class="screen active">
        <div class="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 class="text-5xl font-bold mb-12 text-center">Skygotchimon</h1>
            <div class="flex flex-col gap-4 w-full max-w-xs">
                <button id="new-game-btn" class="menu-btn bg-indigo-600 hover:bg-indigo-700">Novo Jogo</button>
                <button id="load-game-btn" class="menu-btn bg-gray-600 hover:bg-gray-700 opacity-50 cursor-not-allowed" disabled>Carregar Jogo</button>
                <button id="options-btn" class="menu-btn bg-gray-600 hover:bg-gray-700 opacity-50 cursor-not-allowed" disabled>Opções</button>
                <button id="exit-btn" class="menu-btn bg-red-600 hover:bg-red-700">Sair</button>
            </div>
        </div>
    </section>


    <!-- Tela Castelo -->
    <section id="tela-castelo" class="screen hidden">
        <div class="flex flex-col items-center justify-center min-h-screen p-4 relative">
            <div id="casa-div" style="width: 300px; height: 150px; border: 1px solid white; display: flex; align-items: center; justify-content: center; cursor: pointer;">
                Casa
            </div>
            <!-- Div de construção (sempre oculta até clicar em construir) -->
        <div id="build-placeholder" class="js-hidden build-placeholder" style="display: none; position: absolute; left: calc(50% + 150px); top: 50%; transform: translateY(-50%); width: 75px; height: 150px; border: 2px dashed #38bdf8; background: rgba(56,189,248,0.08); z-index: 10; font-size: 2.5rem; color: #38bdf8; font-weight: bold;">
                 +
            </div>
            <!-- Menu de opções de construção (inicialmente oculto) -->
            <div id="build-menu" class="js-hidden build-menu" style="position: absolute; left: calc(50% + 160px); top: 50%; transform: translateY(-50%); z-index: 11;">
                <div class="build-option" data-type="energia">Energia</div>
                <div class="build-option" data-type="comida">Comida</div>
                <div class="build-option" data-type="agua">Água</div>
            </div>
            <!-- Menu Expansivo (apenas uma instância) -->
            <div class="fixed bottom-4 right-4 z-50 flex flex-col-reverse items-end fab-menu">
                <!-- Botão principal (menu/hamburger) -->
                <button class="w-16 h-16 bg-blue-600 text-white rounded-full flex items-center justify-center shadow-lg focus:outline-none fab-toggle">
                    <span class="sr-only">Abrir menu</span>
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                        <line x1="5" y1="7" x2="19" y2="7" stroke-linecap="round" />
                        <line x1="5" y1="12" x2="19" y2="12" stroke-linecap="round" />
                        <line x1="5" y1="17" x2="19" y2="17" stroke-linecap="round" />
                    </svg>
                </button>
                <!-- Menu expansivo (acima do botão) -->
                <div class="bg-gray-800 rounded-lg shadow-lg p-4 flex flex-col items-end mb-2 fab-actions" style="display: none; min-width: 160px;">
                    <button id="build-mode-btn" class="w-full px-4 py-2 bg-blue-500 hover:bg-blue-700 text-white rounded font-bold text-base text-right transition">Construir</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Tela 1: Escolha do Ovo -->
    <section id="tela-ovo" class="screen hidden">
        <div class="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 class="text-4xl font-bold mb-8 text-center">Escolha seu Ovo</h1>
            <div class="flex flex-col gap-8 items-center">
                <!-- Primeira linha: 4 ovos -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="egg-container w-32 h-32 flex flex-col items-center justify-center" data-element="fire">
                        <video src="assets/videos/eggs/fire_egg.mp4" class="egg-image" autoplay loop muted playsinline></video>
                        <p class="egg-label">Fogo</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="water">
                        <img src="assets/images/eggs/water_egg.png" alt="Ovo de Água" class="egg-image">
                        <p class="egg-label">Água</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="earth">
                        <img src="assets/images/eggs/earth_egg.png" alt="Ovo de Terra" class="egg-image">
                        <p class="egg-label">Terra</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="air">
                        <img src="assets/images/eggs/air_egg.png" alt="Ovo de Ar" class="egg-image">
                        <p class="egg-label">Ar</p>
                    </div>
                </div>
                <!-- Segunda linha: 4 ovos -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="life">
                        <img src="assets/images/eggs/life_egg.png" alt="Ovo de Vida" class="egg-image">
                        <p class="egg-label">Vida</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="undead">
                        <img src="assets/images/eggs/undead_egg.png" alt="Ovo de Morto-Vivo" class="egg-image">
                        <p class="egg-label">Morto-Vivo</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="magic">
                        <img src="assets/images/eggs/magic_egg.png" alt="Ovo de Magia" class="egg-image">
                        <p class="egg-label">Magia</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="tech">
                        <img src="assets/images/eggs/tecno_egg.png" alt="Ovo de Tecno" class="egg-image">
                        <p class="egg-label">Tecno</p>
                    </div>
                </div>
                <!-- Terceira linha: 2 ovos (bloqueados) -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="light">
                        <img src="assets/images/eggs/light_egg.png" alt="Ovo de Luz (Bloqueado)" class="egg-image">
                        <p class="egg-label">Luz</p>
                    </div>
                    <div class="egg-container locked w-32 h-32 flex flex-col items-center justify-center" data-element="dark">
                        <img src="assets/images/eggs/dark_egg.png" alt="Ovo de Trevas (Bloqueado)" class="egg-image">
                        <p class="egg-label">Trevas</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Tela 2: Incubadora -->
    <section id="tela-incubadora" class="screen hidden">
        <div class="flex flex-col items-center justify-center min-h-screen p-4">
            <h1 class="text-4xl font-bold mb-8 text-center">Incubando o Ovo</h1>
            <div id="incubator-container" class="relative w-full max-w-xl">
                <video id="egg-image-incubator" src="" alt="Ovo na Incubadora" class="w-2/3 mx-auto" autoplay loop playsinline></video>
                <p id="egg-feedback" class="text-center text-lg mt-4"></p>
            </div>
            <div class="w-full max-w-md mt-8">
                <div class="mb-4">
                    <label for="temperature-slider" class="block text-lg font-semibold mb-2">Temperatura</label>
                    <input type="range" id="temperature-slider" min="0" max="100" value="50" class="w-full">
                </div>
                <div class="mb-4">
                    <label for="humidity-slider" class="block text-lg font-semibold mb-2">Umidade</label>
                    <input type="range" id="humidity-slider" min="0" max="100" value="50" class="w-full">
                </div>
                <div class="mb-4">
                    <label for="light-slider" class="block text-lg font-semibold mb-2">Luminosidade</label>
                    <input type="range" id="light-slider" min="0" max="100" value="50" class="w-full">
                </div>
            </div>
            <div id="incubator-progress-bar" class="w-full max-w-md h-4 bg-gray-700 rounded-full mt-8">
                <div class="h-full bg-green-500 rounded-full" style="width: 0%;"></div>
            </div>
        </div>
    </section>

    <!-- Tela de Cuidados (genérica para todos os estágios) -->
    <section id="tela-cuidados" class="screen hidden">
        <div class="relative flex flex-col items-center justify-between min-h-screen p-4">
            <!-- Cabeçalho com Nome e Status -->
            <div class="w-full max-w-4xl mx-auto status-panel">
                <h2 id="creature-name" class="text-3xl font-bold text-center mb-4">Nome da Criatura</h2>
                <!-- Barra de Crescimento -->
                <div class="status-bar mb-6" id="growth-bar-container">
                    <span class="bar-label text-center">Crescimento</span>
                    <div class="bar-background h-5">
                        <div id="growth-bar" class="bar-fill bg-purple-500"></div>
                    </div>
                </div>
                <!-- Container das Barras de Status -->
                <div id="status-bars-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <!-- Barras Primárias -->
                    <div class="status-bar" id="hunger-bar-container"><span class="bar-label">Fome</span><div class="bar-background"><div id="hunger-bar" class="bar-fill bg-yellow-500"></div></div></div>
                    <div class="status-bar" id="happiness-bar-container"><span class="bar-label">Felicidade</span><div class="bar-background"><div id="happiness-bar" class="bar-fill bg-pink-500"></div></div></div>
                    <div class="status-bar" id="cleanliness-bar-container"><span class="bar-label">Limpeza</span><div class="bar-background"><div id="cleanliness-bar" class="bar-fill bg-blue-400"></div></div></div>
                    <div class="status-bar" id="health-bar-container"><span class="bar-label">Saúde</span><div class="bar-background"><div id="health-bar" class="bar-fill bg-green-500"></div></div></div>
                    
                    <!-- Barras Secundárias (visíveis a partir do estágio Criança) -->
                    <div class="status-bar hidden md:col-span-2" id="strength-bar-container">
                        <span class="bar-label">Força</span>
                        <div class="bar-background">
                            <div id="strength-bar" class="bar-fill bg-orange-500"></div>
                        </div>
                    </div>
                    <div class="status-bar hidden md:col-span-2" id="intelligence-bar-container">
                        <span class="bar-label">Inteligência</span>
                        <div class="bar-background">
                            <div id="intelligence-bar" class="bar-fill bg-purple-400"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Área de Exibição da Criatura -->
            <div id="creature-display" class="flex-grow flex items-center justify-center w-full">
                <img id="creature-image" src="" alt="Sua criatura" class="max-w-xs max-h-64">
            </div>

            <!-- Botões de Ação -->
            <div id="action-buttons-container" class="grid grid-cols-3 gap-4 w-full max-w-md mx-auto">
                <!-- Linha 1 -->
                <button id="feed-btn" class="action-btn bg-green-600 hover:bg-green-700" title="Alimentar"><img src="assets/images/ui/icons_buttons/alimentar.png" alt="Alimentar"></button>
                <button id="play-btn" class="action-btn bg-pink-600 hover:bg-pink-700" title="Brincar"><img src="assets/images/ui/icons_buttons/brincar.png" alt="Brincar"></button>
                <button id="clean-btn" class="action-btn bg-cyan-600 hover:bg-cyan-700" title="Limpar"><img src="assets/images/ui/icons_buttons/limpar.png" alt="Limpar"></button>
                
                <!-- Linha 2 -->
                <button id="study-btn" class="action-btn hidden bg-purple-600 hover:bg-purple-700" title="Estudar">Estudar</button>
                <button id="train-btn" class="action-btn hidden bg-orange-600 hover:bg-orange-700" title="Treinar">Treinar</button>
                <button id="sleep-btn" class="action-btn bg-indigo-600 hover:bg-indigo-700" title="Dormir"><img src="assets/images/ui/icons_buttons/dormir.png" alt="Dormir"></button>
            </div>

            <!-- Menu de Debug -->
            <button id="debug-toggle-btn" class="fixed bottom-4 right-4 w-12 h-12 bg-gray-700 text-white rounded-full z-50 flex items-center justify-center shadow-lg font-bold">D</button>
            <div id="debug-panel" class="hidden fixed bottom-20 right-4 bg-gray-800 p-4 rounded-lg shadow-xl z-50 w-64">
                <h3 class="text-lg font-bold mb-2">Debug Menu</h3>
                <!-- Fome -->
                <div>
                    <label for="debug-hunger-slider" class="text-sm">Fome</label>
                    <input type="range" id="debug-hunger-slider" min="0" max="100" class="w-full">
                </div>
                <!-- Felicidade -->
                <div class="mt-2">
                    <label for="debug-happiness-slider" class="text-sm">Felicidade</label>
                    <input type="range" id="debug-happiness-slider" min="0" max="100" class="w-full">
                </div>
                <!-- Sujeira -->
                <div class="mt-2">
                    <label for="debug-cleanliness-slider" class="text-sm">Sujeira</label>
                    <input type="range" id="debug-cleanliness-slider" min="0" max="100" class="w-full">
                </div>
                <!-- Saúde -->
                <div class="mt-2">
                    <label for="debug-health-slider" class="text-sm">Saúde</label>
                    <input type="range" id="debug-health-slider" min="0" max="100" class="w-full">
                </div>
            </div>
        </div>
    </section>
    
    <!-- Pop-up de Confirmação do Ovo -->
    <div id="egg-info-popup" class="fixed inset-0 bg-black bg-opacity-75 flex justify-center items-start p-4 hidden z-50 overflow-y-auto">
        <div class="bg-gray-800 rounded-lg shadow-xl max-w-2xl w-full p-6 flex flex-col items-center my-8 popup-content-scroll">
            <!-- Imagem do Ovo -->
            <div class="w-full flex justify-center mb-4">
                <video id="popup-egg-image" src="" alt="Ovo Selecionado" class="w-48 h-48" autoplay loop playsinline></video>
            </div>
    
            <!-- Conteúdo de Texto -->
            <div class="w-full text-justify">
                <h2 id="popup-egg-title" class="text-3xl font-bold mb-4 text-center"></h2>
                <div id="popup-egg-description" class="text-base space-y-2">
                </div>
            </div>
    
            <!-- Botão de Continuar -->
            <div class="w-full flex justify-center gap-4 mt-6">
                <button id="popup-back-btn" class="px-6 py-2 bg-gray-600 hover:bg-gray-700 rounded-md font-bold">Voltar</button>
                <button id="popup-continue-btn" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 rounded-md font-bold">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/ui.js" type="module"></script>
    <script src="js/main.js" type="module"></script>
</body>
</html>
